[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "canscope"
dynamic = ["version"]
description = "Terminal CAN bus analyzer: live DBC decoding, signal plots, simulation and log replay."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pedro Trenado" }]
requires-python = ">=3.10"
dependencies = [
    "cantools>=40",
    "python-can>=4.3",
    "textual>=1.0",
]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Networking :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/pedrotrenado/canscope"
Issues = "https://github.com/pedrotrenado/canscope/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
canscope = "canscope.cli:main"

[tool.hatch.version]
path = "src/canscope/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
